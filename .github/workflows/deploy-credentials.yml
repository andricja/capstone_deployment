name: Deploy Environment Variables

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,BACKEND_PATH
          script: |
            cd ${{ secrets.BACKEND_PATH }}
            
            # Backup current .env
            cp .env .env.backup.$(date +%Y%m%d_%H%M%S)
            
            # Update Google OAuth credentials
            sed -i "s|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}|" .env
            sed -i "s|^GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}|" .env
            
            # Clear Laravel caches
            php artisan config:clear
            php artisan cache:clear
            php artisan optimize:clear
            
            echo "✅ Environment variables updated successfully"

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.BACKEND_PATH }}
            
            # Check if variables are set (without showing values)
            if grep -q "^GOOGLE_CLIENT_ID=" .env; then
              echo "✅ GOOGLE_CLIENT_ID is set"
            else
              echo "❌ GOOGLE_CLIENT_ID is not set"
            fi
            
            if grep -q "^GOOGLE_CLIENT_SECRET=" .env; then
              echo "✅ GOOGLE_CLIENT_SECRET is set"
            else
              echo "❌ GOOGLE_CLIENT_SECRET is not set"
            fi
